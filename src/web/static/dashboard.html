<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VITA — Hospital Dashboard</title>
<link rel="stylesheet" href="/static/vita.css">
<style>
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
    gap: 16px;
    padding: 16px 20px 40px;
    align-items: start;
    max-width: 1500px;
    margin: 0 auto;
  }
  @media (max-width: 1080px) { .layout { grid-template-columns: 1fr; } }

  .counts { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .count {
    display: flex; flex-direction: column; gap: 2px;
    padding: 7px 12px; border-radius: 8px; background: var(--panel-2);
    border: 1px solid var(--line); min-width: 82px;
  }
  .count .n { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .count .k { font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
  .count.CRITICAL .n { color: var(--critical); }
  .count.HIGH .n     { color: var(--high); }
  .count.MODERATE .n { color: var(--moderate); }
  .count.LOW .n      { color: var(--low); }

  .filters { display: flex; gap: 6px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .filters button { padding: 5px 11px; font-size: 13px; }
  .filters button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  .section { margin-top: 18px; }
  .section h4 {
    margin: 0 0 8px; font-size: 11px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--muted); font-weight: 650;
  }

  .verbatim {
    background: var(--panel-2); border-left: 3px solid var(--accent);
    padding: 10px 13px; border-radius: 0 7px 7px 0; margin: 0;
    font-style: italic; color: var(--ink-2); line-height: 1.55;
  }

  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 14px; font-size: 14px; }
  .kv dt { color: var(--muted); font-size: 13px; }
  .kv dd { margin: 0; }

  .reason { padding: 10px 0; border-bottom: 1px solid var(--line-2); }
  .reason:last-child { border-bottom: none; }
  .reason .src { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .reason .cond { font-size: 12.5px; color: var(--ink-2); margin-top: 5px; }

  .trail { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .trail li { padding: 6px 0; border-bottom: 1px solid var(--line-2); display: flex; gap: 10px; }
  .trail li:last-child { border-bottom: none; }
  .trail .at { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 12px; }
  .trail .act { font-weight: 560; white-space: nowrap; }
  .trail .dt { color: var(--ink-2); }

  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }

  .empty { padding: 40px 20px; text-align: center; color: var(--muted); }

  .tabs { display: flex; gap: 4px; }
  .tabs button { padding: 5px 11px; font-size: 13px; }
  .tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  .mail { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
  .mail-head { padding: 9px 12px; background: var(--panel-2); border-bottom: 1px solid var(--line); font-size: 13px; }
  .mail-body { padding: 12px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">VITA <small>Hospital Dashboard</small></div>
  <div class="spacer"></div>
  <span class="tiny muted" id="notify-state"></span>
  <span class="mode" id="mode">…</span>
  <a class="navlink" href="/">← Patient view</a>
</div>

<div class="layout">

  <!-- queue -->
  <div class="panel">
    <div class="counts" id="counts"></div>
    <div class="filters">
      <button data-status="" class="on">All</button>
      <button data-status="awaiting_review">Awaiting review</button>
      <button data-status="reviewed">Reviewed</button>
      <button data-status="intake">In progress</button>
      <div style="flex:1"></div>
      <button id="refresh">Refresh</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Case</th><th>Urgency</th><th>Complaint</th>
            <th>Department</th><th>Status</th><th>Lang</th>
          </tr>
        </thead>
        <tbody id="queue"></tbody>
      </table>
    </div>
    <div class="empty" id="queue-empty" hidden>
      No cases yet. Start one from the patient view.
    </div>
  </div>

  <!-- detail -->
  <div class="panel">
    <div class="panel-head">
      <span id="detail-title">Case detail</span>
      <div style="flex:1"></div>
      <div class="tabs">
        <button data-tab="case" class="on">Case</button>
        <button data-tab="note">Note</button>
        <button data-tab="mail">Notifications</button>
      </div>
    </div>
    <div class="panel-body" id="detail">
      <div class="empty">Select a case from the queue.</div>
    </div>
  </div>

</div>

<script>
const $ = (id) => document.getElementById(id);
let selected = null;
let filter = "";
let tab = "case";
let cachedNote = null;

async function api(path, options) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
}

const el = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
};

function section(title, node) {
  const wrap = el("div", "section");
  wrap.append(el("h4", null, title), node);
  return wrap;
}

function list(items, cls) {
  const ul = el("ul", `facts ${cls || ""}`);
  if (!items || !items.length) {
    ul.append(el("li", "muted", "Nothing recorded."));
    return ul;
  }
  for (const item of items) ul.append(el("li", null, item));
  return ul;
}

/* ---------- header ---------- */

async function refreshStatus() {
  try {
    const health = await api("/api/health");
    $("mode").textContent = health.mode;
    $("mode").className = `mode ${health.mode}`;
    $("notify-state").textContent = health.notify_enabled
      ? "notifications: live"
      : "notifications: dry run";
  } catch {
    $("mode").textContent = "unreachable";
  }
}

/* ---------- queue ---------- */

async function refreshQueue() {
  const data = await api(`/api/queue${filter ? `?status=${filter}` : ""}`);

  const counts = $("counts");
  counts.replaceChildren();
  for (const key of ["CRITICAL", "HIGH", "MODERATE", "LOW"]) {
    const box = el("div", `count ${key}`);
    box.append(el("div", "n", String(data.counts[key] || 0)), el("div", "k", key));
    counts.append(box);
  }
  const awaiting = el("div", "count");
  awaiting.append(
    el("div", "n", String(data.counts.awaiting_review || 0)),
    el("div", "k", "Awaiting review")
  );
  counts.append(awaiting);

  const body = $("queue");
  body.replaceChildren();
  $("queue-empty").hidden = data.cases.length > 0;

  for (const row of data.cases) {
    const tr = el("tr");
    if (row.case_id === selected) tr.classList.add("selected");
    tr.onclick = () => selectCase(row.case_id);

    const idCell = el("td");
    idCell.append(el("code", "tiny", row.case_id));

    const urgencyCell = el("td");
    if (row.urgency) urgencyCell.append(el("span", `urgency ${row.urgency}`, row.urgency));
    else urgencyCell.append(el("span", "tiny muted", "in progress"));

    tr.append(
      idCell,
      urgencyCell,
      el("td", null, (row.complaint || "").replace(/_/g, " ")),
      el("td", null, row.department || "—"),
      el("td", "tiny muted", (row.status || "").replace(/_/g, " ")),
      el("td", "tiny muted", row.language || "en")
    );
    body.append(tr);
  }
}

/* ---------- detail ---------- */

async function selectCase(caseId) {
  selected = caseId;
  cachedNote = null;
  $("detail-title").textContent = caseId;
  await refreshQueue();
  await renderDetail();
}

async function loadNote() {
  if (!cachedNote) cachedNote = await api(`/api/cases/${selected}/note`);
  return cachedNote;
}

async function renderDetail() {
  if (!selected) return;
  const detail = $("detail");
  detail.replaceChildren(el("div", "empty", "Loading…"));

  try {
    if (tab === "case") await renderCase(detail);
    else if (tab === "note") await renderNote(detail);
    else await renderMail(detail);
  } catch (err) {
    detail.replaceChildren(el("div", "empty", `Could not load: ${err.message}`));
  }
}

async function renderCase(detail) {
  const [kase, note] = await Promise.all([api(`/api/cases/${selected}`), loadNote()]);
  detail.replaceChildren();

  const rec = note.recommendation || {};

  /* headline */
  const head = el("div");
  head.style.cssText = "display:flex;align-items:center;gap:10px;flex-wrap:wrap";
  if (rec.urgency) head.append(el("span", `urgency ${rec.urgency}`, rec.urgency));
  if (kase.overridden) {
    head.append(el("span", "tiny muted", `system said ${kase.system_urgency}`));
  }
  head.append(el("strong", null, rec.department || "—"));
  for (const flag of kase.red_flags || []) head.append(el("span", "flag", flag));
  detail.append(head);

  if (note.routing) detail.append(el("div", "banner info", note.routing));

  if (rec.requires_human_review) {
    const reasons = (note.escalation.reasons || []).map((r) => r.explanation).join(" ");
    detail.append(el("div", "banner warn", `Human review required. ${reasons}`));
  }

  if (note.system_mode && note.system_mode !== "FULL") {
    detail.append(el("div", "banner stop",
      `Decided in ${note.system_mode} mode — language understanding was unavailable.`));
  }

  /* what the patient actually said */
  const said = (kase.turns || []).filter((t) => t.role === "patient");
  if (said.length) {
    const box = el("div");
    for (const turn of said) {
      const q = el("p", "verbatim", turn.text);
      q.style.marginBottom = "8px";
      box.append(q);
    }
    detail.append(section(`Patient's own words (${kase.language})`, box));
  }

  /* reasoning */
  if (note.reasoning && note.reasoning.length) {
    const box = el("div");
    for (const r of note.reasoning) {
      const row = el("div", "reason");
      const head2 = el("div");
      const chip = el("span", "rule-chip", r.rule_id);
      chip.onclick = () => showRule(r.rule_id);
      head2.append(chip, ` ${r.urgency} · ${r.department}`);
      row.append(head2, el("div", "cond", r.rationale));
      for (const c of r.conditions_met || []) row.append(el("div", "cond", `✓ ${c}`));
      row.append(el("div", "src", r.source));
      box.append(row);
    }
    detail.append(section("Rules applied", box));
  } else {
    detail.append(section("Rules applied",
      el("div", "muted small", "No rule matched the established facts.")));
  }

  /* the three views */
  detail.append(section("Patient reported", list(note.patient_reported)));
  detail.append(section("Established by follow-up", list(note.established_by_followup)));
  if (note.recalled_from_records && note.recalled_from_records.length) {
    detail.append(section("Recalled from previous visits", list(note.recalled_from_records)));
  }
  detail.append(section("Unknown", list(note.unknown, "unknown-list")));

  if (note.contradictions && note.contradictions.length) {
    detail.append(section("Conflicting answers — not resolved by VITA",
      list(note.contradictions, "unknown-list")));
  }

  if (note.unresolved_rules && note.unresolved_rules.length) {
    const box = el("div");
    for (const r of note.unresolved_rules) {
      const row = el("div", "reason");
      const chip = el("span", "rule-chip", r.rule_id);
      chip.onclick = () => showRule(r.rule_id);
      const head3 = el("div");
      head3.append(chip, ` ${r.urgency} — could not be ruled out`);
      row.append(head3);
      for (const w of r.waiting_on) row.append(el("div", "cond", `waiting on: ${w}`));
      box.append(row);
    }
    detail.append(section("Could not be ruled out", box));
  }

  /* clinician actions */
  const actions = el("div", "actions");
  const select = el("select");
  for (const level of ["CRITICAL", "HIGH", "MODERATE", "LOW"]) {
    const option = el("option", null, level);
    option.value = level;
    if (level === rec.urgency) option.selected = true;
    select.append(option);
  }
  const reason = el("input");
  reason.type = "text";
  reason.placeholder = "Reason for override";
  reason.style.flex = "1";
  reason.style.minWidth = "160px";

  const apply = el("button", "primary", "Override");
  apply.onclick = async () => {
    if (!reason.value.trim()) { alert("An override needs a reason."); return; }
    apply.disabled = true;
    try {
      await api(`/api/cases/${selected}/override`, {
        method: "POST",
        body: JSON.stringify({ urgency: select.value, reason: reason.value.trim(), by: "Dr. on duty" }),
      });
      cachedNote = null;
      await refreshQueue();
      await renderDetail();
    } catch (err) {
      alert(`Override failed: ${err.message}`);
    } finally { apply.disabled = false; }
  };

  const done = el("button", null, "Mark reviewed");
  done.onclick = async () => {
    await api(`/api/cases/${selected}/review`, {
      method: "POST", body: JSON.stringify({ by: "Dr. on duty" }),
    });
    cachedNote = null;
    await refreshQueue();
    await renderDetail();
  };

  actions.append(select, reason, apply, done);
  detail.append(section("Clinician action", actions));

  if (kase.override && kase.override.urgency) {
    detail.append(el("div", "banner info",
      `Overridden to ${kase.override.urgency} by ${kase.override.by}: ${kase.override.reason}`));
  }

  /* audit */
  if (note.audit && note.audit.length) {
    const ul = el("ul", "trail");
    for (const entry of note.audit) {
      const li = el("li");
      li.append(
        el("span", "at", (entry.at || "").replace("T", " ").replace("+00:00", "")),
        el("span", "act", entry.action.replace(/_/g, " ")),
        el("span", "dt", entry.detail || "")
      );
      ul.append(li);
    }
    detail.append(section("Audit trail", ul));
  }
}

async function renderNote(detail) {
  const note = await loadNote();
  detail.replaceChildren();
  detail.append(el("pre", "note-text", note.text || "Intake not yet complete."));
}

async function renderMail(detail) {
  const note = await loadNote();
  detail.replaceChildren();

  const messages = note.notifications || [];
  if (!messages.length) {
    detail.append(el("div", "empty", "No notification was sent for this case."));
    return;
  }

  for (const message of messages) {
    const box = el("div", "mail");
    const head = el("div", "mail-head");
    head.append(
      el("div", null, `To: ${message.recipient_name} <${message.recipient}>`),
      el("div", "tiny muted", message.subject),
      el("div", "tiny", message.status)
    );
    const body = el("div", "mail-body");
    body.append(el("pre", "note-text", message.body));
    box.append(head, body);
    detail.append(box);
  }
}

async function showRule(ruleId) {
  try {
    const rule = await api(`/api/rules/${ruleId}`);
    const conditions = rule.conditions.map((c) => `  • ${c.fact} ${c.op} ${c.value}`).join("\n");
    alert(
      `${rule.rule_id} — ${rule.urgency}, ${rule.department}\n\n${rule.rationale}\n\n` +
      `Conditions (all must hold):\n${conditions}\n\nSource: ${rule.source}\nVersion: ${rule.version}`
    );
  } catch {
    alert(`Rule ${ruleId} could not be loaded.`);
  }
}

/* ---------- wiring ---------- */

for (const button of document.querySelectorAll(".filters button[data-status]")) {
  button.onclick = () => {
    document.querySelectorAll(".filters button[data-status]").forEach((b) => b.classList.remove("on"));
    button.classList.add("on");
    filter = button.dataset.status;
    refreshQueue();
  };
}

for (const button of document.querySelectorAll(".tabs button")) {
  button.onclick = () => {
    document.querySelectorAll(".tabs button").forEach((b) => b.classList.remove("on"));
    button.classList.add("on");
    tab = button.dataset.tab;
    renderDetail();
  };
}

$("refresh").onclick = () => { refreshQueue(); refreshStatus(); };

refreshStatus();
refreshQueue();
setInterval(refreshQueue, 8000);
setInterval(refreshStatus, 15000);
</script>
</body>
</html>
