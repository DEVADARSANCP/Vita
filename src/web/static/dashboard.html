<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VITA — Hospital Dashboard</title>
<link rel="stylesheet" href="/static/vita.css">
<style>
  .layout {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
    gap: 14px; padding: 14px 18px 40px; align-items: start;
    max-width: 1640px; margin: 0 auto;
  }
  @media (max-width: 1120px) { .layout { grid-template-columns: 1fr; } }

  .counts { display: flex; gap: 7px; flex-wrap: wrap; padding: 11px 14px; border-bottom: 1px solid var(--line); }
  .count {
    display: flex; flex-direction: column; gap: 2px; padding: 6px 11px;
    border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); min-width: 76px;
  }
  .count .n { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .count .k { font-size: 9.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .count.CRITICAL .n { color: var(--critical); }
  .count.HIGH .n { color: var(--high); }
  .count.MODERATE .n { color: var(--moderate); }
  .count.LOW .n { color: var(--low); }

  .tabs { display: flex; gap: 3px; flex-wrap: wrap; }
  .tabs button { padding: 5px 10px; font-size: 12.5px; }
  .tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tabs button .pill {
    display: inline-block; margin-left: 5px; padding: 0 5px; border-radius: 8px;
    background: var(--critical); color: #fff; font-size: 10px; font-weight: 700;
  }

  .filters { display: flex; gap: 5px; padding: 9px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .filters button { padding: 4px 10px; font-size: 12.5px; }
  .filters button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  .section { margin-top: 16px; }
  .section h4 {
    margin: 0 0 7px; font-size: 10.5px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted); font-weight: 650;
  }

  .convo { display: flex; flex-direction: column; gap: 9px; }
  .turn { display: flex; }
  .turn.patient { justify-content: flex-end; }
  .turn .bub { max-width: 84%; padding: 8px 11px; border-radius: 11px; font-size: 13.5px; line-height: 1.5; }
  .turn.vita .bub { background: var(--panel-2); border: 1px solid var(--line); border-bottom-left-radius: 3px; }
  .turn.patient .bub { background: var(--accent-soft); border: 1px solid var(--accent); border-bottom-right-radius: 3px; }
  .turn .who { font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; font-weight: 650; }

  .impression {
    background: var(--moderate-bg); border: 1px solid var(--moderate);
    border-radius: 8px; padding: 11px 13px; font-size: 13.5px; line-height: 1.55; color: var(--ink);
  }
  .impression .tag {
    display: block; font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--moderate); font-weight: 700; margin-bottom: 5px;
  }

  .req { border: 1px solid var(--line); border-radius: 9px; margin-bottom: 9px; overflow: hidden; }
  .req.pending { border-color: var(--accent); }
  .req-head { padding: 9px 12px; background: var(--panel-2); border-bottom: 1px solid var(--line); display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
  .req-body { padding: 11px 12px; font-size: 13.5px; line-height: 1.55; }
  .req-why { color: var(--ink-2); }
  .req-consq { font-size: 12px; color: var(--muted); margin-top: 7px; }
  .req-act { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .req-act input, .req-act select { font-size: 13px; padding: 6px 9px; }
  .req-act input.note { flex: 1; min-width: 130px; }
  .badge { font-size: 10px; font-weight: 700; letter-spacing: .05em; padding: 2px 7px; border-radius: 5px; text-transform: uppercase; }
  .badge.pending { background: var(--accent-soft); color: var(--accent); }
  .badge.approved { background: var(--low-bg); color: var(--low); }
  .badge.rejected { background: var(--critical-bg); color: var(--critical); }

  .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 7px; }
  .room { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; background: var(--panel-2); }
  .room.busy { opacity: .55; }
  .room b { display: block; font-size: 13.5px; }
  .room .who { color: var(--accent); font-size: 11.5px; margin-top: 3px; }

  .verbatim { background: var(--panel-2); border-left: 3px solid var(--accent); padding: 9px 12px; border-radius: 0 7px 7px 0; margin: 0 0 7px; font-style: italic; color: var(--ink-2); }
  .reason { padding: 9px 0; border-bottom: 1px solid var(--line-2); }
  .reason:last-child { border-bottom: none; }
  .reason .src { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .reason .cond { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; }
  .trail { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
  .trail li { padding: 5px 0; border-bottom: 1px solid var(--line-2); display: flex; gap: 9px; }
  .trail li:last-child { border-bottom: none; }
  .trail .at { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 11.5px; }
  .trail .act { font-weight: 560; white-space: nowrap; }
  .actions { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .empty { padding: 34px 18px; text-align: center; color: var(--muted); }
  .mail { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 9px; overflow: hidden; }
  .mail-head { padding: 8px 11px; background: var(--panel-2); border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .mail-body { padding: 11px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">VITA <small>Hospital Dashboard</small></div>
  <div class="spacer"></div>
  <span class="tiny muted" id="notify-state"></span>
  <span class="mode" id="mode">…</span>
  <a class="navlink" href="/evaluation">Evaluation</a>
  <a class="navlink" href="/">← Patient view</a>
</div>

<div class="layout">

  <div>
    <div class="panel" style="margin-bottom:14px">
      <div class="counts" id="counts"></div>
      <div class="filters">
        <button data-status="" class="on">All</button>
        <button data-status="awaiting_review">Awaiting review</button>
        <button data-status="reviewed">Reviewed</button>
        <button data-status="intake">In progress</button>
        <div style="flex:1"></div>
        <button id="refresh">Refresh</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Case</th><th>Patient</th><th>Urgency</th>
            <th>Complaint</th><th>Department</th><th>Status</th>
          </tr></thead>
          <tbody id="queue"></tbody>
        </table>
      </div>
      <div class="empty" id="queue-empty" hidden>No cases yet.</div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <span>Hospital</span>
        <div style="flex:1"></div>
        <div class="tabs" id="hosp-tabs">
          <button data-h="requests" class="on">Requests<span class="pill" id="req-pill" hidden></span></button>
          <button data-h="doctors">Doctors</button>
          <button data-h="rooms">Rooms</button>
        </div>
      </div>
      <div class="panel-body" id="hospital"></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <span id="detail-title">Case detail</span>
      <div style="flex:1"></div>
      <div class="tabs" id="case-tabs">
        <button data-tab="case" class="on">Case</button>
        <button data-tab="convo">Conversation</button>
        <button data-tab="note">Note</button>
        <button data-tab="mail">Email</button>
      </div>
    </div>
    <div class="panel-body" id="detail"><div class="empty">Select a case from the queue.</div></div>
  </div>

</div>

<script>
const $ = (id) => document.getElementById(id);
let selected = null, filter = "", tab = "case", hospTab = "requests", cachedNote = null;

async function api(path, options) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  if (!res.ok) {
    let detail = `${res.status} ${res.statusText}`;
    try { detail = (await res.json()).detail || detail; } catch {}
    throw new Error(detail);
  }
  return res.json();
}
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x !== undefined) n.textContent = x; return n; };
const section = (title, node) => { const w = el("div", "section"); w.append(el("h4", null, title), node); return w; };
function list(items, cls) {
  const ul = el("ul", `facts ${cls || ""}`);
  if (!items || !items.length) { ul.append(el("li", "muted", "Nothing recorded.")); return ul; }
  for (const i of items) ul.append(el("li", null, i));
  return ul;
}

async function refreshStatus() {
  try {
    const h = await api("/api/health");
    $("mode").textContent = h.mode;
    $("mode").className = `mode ${h.mode}`;
    $("notify-state").textContent = h.notify_enabled ? "email: live" : "email: dry run";
  } catch { $("mode").textContent = "unreachable"; }
}

async function refreshQueue() {
  const data = await api(`/api/queue${filter ? `?status=${filter}` : ""}`);
  const counts = $("counts");
  counts.replaceChildren();
  for (const k of ["CRITICAL", "HIGH", "MODERATE", "LOW"]) {
    const b = el("div", `count ${k}`);
    b.append(el("div", "n", String(data.counts[k] || 0)), el("div", "k", k));
    counts.append(b);
  }
  const aw = el("div", "count");
  aw.append(el("div", "n", String(data.counts.awaiting_review || 0)), el("div", "k", "Awaiting review"));
  counts.append(aw);

  const body = $("queue");
  body.replaceChildren();
  $("queue-empty").hidden = data.cases.length > 0;
  for (const row of data.cases) {
    const tr = el("tr");
    if (row.case_id === selected) tr.classList.add("selected");
    tr.onclick = () => selectCase(row.case_id);
    const idc = el("td"); idc.append(el("code", "tiny", row.case_id));
    const uc = el("td");
    if (row.urgency) uc.append(el("span", `urgency ${row.urgency}`, row.urgency));
    else uc.append(el("span", "tiny muted", "in progress"));
    tr.append(
      idc,
      el("td", null, row.patient_name || "—"),
      uc,
      el("td", null, (row.complaint || "").replace(/_/g, " ")),
      el("td", null, row.department || "—"),
      el("td", "tiny muted", (row.status || "").replace(/_/g, " "))
    );
    body.append(tr);
  }
}

async function renderHospital() {
  const host = $("hospital");
  host.replaceChildren(el("div", "empty", "Loading…"));
  try {
    if (hospTab === "requests") await renderRequests(host);
    else if (hospTab === "doctors") await renderDoctors(host);
    else await renderRooms(host);
  } catch (err) { host.replaceChildren(el("div", "empty", `Could not load: ${err.message}`)); }
}

async function renderRequests(host) {
  const data = await api("/api/requests");
  const pending = data.counts.pending || 0;
  const pill = $("req-pill");
  pill.hidden = pending === 0;
  pill.textContent = String(pending);

  host.replaceChildren();
  const intro = el("p", "small muted");
  intro.style.margin = "0 0 12px";
  intro.textContent = "What the assistant has asked for. Nothing here has happened — approving is what makes it happen.";
  host.append(intro);

  if (!data.requests.length) { host.append(el("div", "empty", "No requests.")); return; }

  for (const r of data.requests) {
    const box = el("div", `req ${r.status === "pending" ? "pending" : ""}`);
    const head = el("div", "req-head");
    head.append(el("span", `badge ${r.status}`, r.status), el("strong", null, r.label), el("code", "tiny muted", r.case_id));

    const body = el("div", "req-body");
    body.append(el("div", null, r.summary));
    body.append(el("div", "req-why", r.reasoning));
    if (r.evidence && r.evidence.length) body.append(el("div", "req-consq", `Based on: ${r.evidence.join(", ")}`));
    body.append(el("div", "req-consq", `If approved: ${r.consequence}`));

    if (r.status === "pending") {
      const act = el("div", "req-act");
      let roomPicker = null;
      if (r.kind === "admit_patient") {
        roomPicker = el("select");
        roomPicker.append(el("option", null, "Choose a room…"));
        try {
          const q = r.payload.department ? `?department=${encodeURIComponent(r.payload.department)}` : "";
          const rooms = await api(`/api/rooms${q}`);
          for (const room of rooms.rooms.filter((x) => !x.occupied)) {
            const o = el("option", null, `${room.room_id} · ${room.department} · ${room.type}`);
            o.value = room.room_id;
            roomPicker.append(o);
          }
        } catch {}
        act.append(roomPicker);
      }
      const note = el("input", "note"); note.type = "text"; note.placeholder = "Note (optional)";
      const yes = el("button", "primary", "Approve");
      const no = el("button", null, "Reject");
      const decide = async (approved) => {
        yes.disabled = no.disabled = true;
        try {
          await api(`/api/requests/${r.request_id}/decide`, {
            method: "POST",
            body: JSON.stringify({
              approved, by: "Dr. on duty", note: note.value.trim(),
              room_id: roomPicker ? roomPicker.value : "",
            }),
          });
          cachedNote = null;
          await renderHospital(); await refreshQueue();
          if (selected) await renderDetail();
        } catch (err) { alert(err.message); yes.disabled = no.disabled = false; }
      };
      yes.onclick = () => decide(true);
      no.onclick = () => decide(false);
      act.append(note, yes, no);
      body.append(act);
    } else {
      body.append(el("div", "req-consq",
        `${r.status} by ${r.decided_by}${r.decision_note ? ` — ${r.decision_note}` : ""}`));
    }
    box.append(head, body);
    host.append(box);
  }
}

async function renderDoctors(host) {
  const data = await api("/api/doctors");
  host.replaceChildren();
  const wrap = el("div", "table-wrap");
  const table = el("table");
  const thead = el("thead");
  const hr = el("tr");
  for (const h of ["Name", "Department", "Contact", "On call"]) hr.append(el("th", null, h));
  thead.append(hr);
  const body = el("tbody");
  for (const d of data.doctors) {
    const tr = el("tr");
    tr.style.cursor = "default";
    const contact = el("td");
    contact.append(el("div", "tiny", d.email || "—"));
    if (d.phone) contact.append(el("div", "tiny muted", d.phone));
    tr.append(el("td", null, d.name), el("td", null, d.department), contact,
              el("td", "tiny", d.on_call ? "on call" : "—"));
    body.append(tr);
  }
  table.append(thead, body);
  wrap.append(table);
  host.append(wrap);
}

async function renderRooms(host) {
  const data = await api("/api/rooms");
  host.replaceChildren();
  const byRoom = {};
  for (const a of data.admissions) byRoom[a.room_id] = a;
  const grid = el("div", "grid2");
  for (const r of data.rooms) {
    const box = el("div", `room ${r.occupied ? "busy" : ""}`);
    box.append(el("b", null, r.room_id), el("div", "muted", `${r.department} · ${r.type}`));
    const a = byRoom[r.room_id];
    box.append(a ? el("div", "who", a.patient_name || a.case_id) : el("div", "tiny muted", "free"));
    grid.append(box);
  }
  const free = data.rooms.filter((r) => !r.occupied).length;
  host.append(el("p", "small muted", `${free} of ${data.rooms.length} rooms free.`), grid);
}

async function selectCase(caseId) {
  selected = caseId; cachedNote = null;
  $("detail-title").textContent = caseId;
  await refreshQueue(); await renderDetail();
}
const loadNote = async () => (cachedNote ||= await api(`/api/cases/${selected}/note`));

async function renderDetail() {
  if (!selected) return;
  const d = $("detail");
  d.replaceChildren(el("div", "empty", "Loading…"));
  try {
    if (tab === "case") await renderCase(d);
    else if (tab === "convo") await renderConvo(d);
    else if (tab === "note") await renderNote(d);
    else await renderMail(d);
  } catch (err) { d.replaceChildren(el("div", "empty", `Could not load: ${err.message}`)); }
}

async function renderCase(d) {
  const kase = await api(`/api/cases/${selected}`);
  const note = await loadNote();
  d.replaceChildren();
  const rec = note.recommendation || {};

  const head = el("div");
  head.style.cssText = "display:flex;align-items:center;gap:9px;flex-wrap:wrap";
  if (rec.urgency) head.append(el("span", `urgency ${rec.urgency}`, rec.urgency));
  if (kase.overridden) head.append(el("span", "tiny muted", `system said ${kase.system_urgency}`));
  head.append(el("strong", null, rec.department || "—"));
  if (note.patient && note.patient.name) head.append(el("span", "tiny muted", note.patient.name));
  for (const f of kase.red_flags || []) head.append(el("span", "flag", f));
  d.append(head);

  if (note.routing) d.append(el("div", "banner info", note.routing));
  if (rec.requires_human_review) {
    d.append(el("div", "banner warn",
      `Human review required. ${(note.escalation.reasons || []).map((r) => r.explanation).join(" ")}`));
  }
  if (note.system_mode && note.system_mode !== "FULL") {
    d.append(el("div", "banner stop", `Decided in ${note.system_mode} mode.`));
  }

  if (note.clinical_impression) {
    const box = el("div", "impression");
    box.append(el("span", "tag", "AI impression — not a diagnosis"),
               document.createTextNode(note.clinical_impression));
    d.append(section("What the assistant makes of it", box));
  }

  const said = (note.conversation || []).filter((t) => t.role === "patient");
  if (said.length) {
    const box = el("div");
    for (const t of said.slice(0, 3)) box.append(el("p", "verbatim", t.text));
    d.append(section(`Patient's own words (${kase.language})`, box));
  }

  if (note.reasoning && note.reasoning.length) {
    const box = el("div");
    for (const r of note.reasoning) {
      const row = el("div", "reason");
      const h = el("div");
      const chip = el("span", "rule-chip", r.rule_id);
      chip.onclick = () => showRule(r.rule_id);
      h.append(chip, ` ${r.urgency} · ${r.department}`);
      row.append(h, el("div", "cond", r.rationale));
      for (const c of r.conditions_met || []) row.append(el("div", "cond", `✓ ${c}`));
      row.append(el("div", "src", r.source));
      box.append(row);
    }
    d.append(section("Rules applied", box));
  } else {
    d.append(section("Rules applied", el("div", "muted small", "No rule matched.")));
  }

  d.append(section("Patient reported", list(note.patient_reported)));
  d.append(section("Established by follow-up", list(note.established_by_followup)));
  if (note.memory && note.memory.length) {
    d.append(section("Remembered from previous visits",
      list(note.memory.map((m) => `[${m.kind}] ${m.text}`))));
  }
  d.append(section("Unknown", list(note.unknown, "unknown-list")));
  if (note.contradictions && note.contradictions.length) {
    d.append(section("Conflicting answers — not resolved by VITA", list(note.contradictions, "unknown-list")));
  }
  if (note.unresolved_rules && note.unresolved_rules.length) {
    const box = el("div");
    for (const r of note.unresolved_rules) {
      const row = el("div", "reason");
      const chip = el("span", "rule-chip", r.rule_id);
      chip.onclick = () => showRule(r.rule_id);
      const h = el("div"); h.append(chip, ` ${r.urgency} — could not be ruled out`);
      row.append(h);
      for (const w of r.waiting_on) row.append(el("div", "cond", `waiting on: ${w}`));
      box.append(row);
    }
    d.append(section("Could not be ruled out", box));
  }

  const actions = el("div", "actions");
  const sel = el("select");
  for (const lvl of ["CRITICAL", "HIGH", "MODERATE", "LOW"]) {
    const o = el("option", null, lvl); o.value = lvl;
    if (lvl === rec.urgency) o.selected = true;
    sel.append(o);
  }
  const reason = el("input"); reason.type = "text"; reason.placeholder = "Reason for override";
  reason.style.cssText = "flex:1;min-width:150px";
  const apply = el("button", "primary", "Override");
  apply.onclick = async () => {
    if (!reason.value.trim()) { alert("An override needs a reason."); return; }
    apply.disabled = true;
    try {
      await api(`/api/cases/${selected}/override`, {
        method: "POST",
        body: JSON.stringify({ urgency: sel.value, reason: reason.value.trim(), by: "Dr. on duty" }),
      });
      cachedNote = null; await refreshQueue(); await renderDetail();
    } catch (err) { alert(err.message); } finally { apply.disabled = false; }
  };
  const done = el("button", null, "Mark reviewed");
  done.onclick = async () => {
    await api(`/api/cases/${selected}/review`, { method: "POST", body: JSON.stringify({ by: "Dr. on duty" }) });
    cachedNote = null; await refreshQueue(); await renderDetail();
  };
  actions.append(sel, reason, apply, done);
  d.append(section("Clinician action", actions));

  if (kase.override && kase.override.urgency) {
    d.append(el("div", "banner info",
      `Overridden to ${kase.override.urgency} by ${kase.override.by}: ${kase.override.reason}`));
  }

  if (note.audit && note.audit.length) {
    const ul = el("ul", "trail");
    for (const e of note.audit) {
      const li = el("li");
      li.append(el("span", "at", (e.at || "").replace("T", " ").replace("+00:00", "")),
                el("span", "act", e.action.replace(/_/g, " ")),
                el("span", null, e.detail || ""));
      ul.append(li);
    }
    d.append(section("Audit trail", ul));
  }
}

async function renderConvo(d) {
  const note = await loadNote();
  d.replaceChildren();
  const turns = note.conversation || [];
  if (!turns.length) { d.append(el("div", "empty", "No conversation recorded.")); return; }
  const box = el("div", "convo");
  for (const t of turns) {
    const row = el("div", `turn ${t.role}`);
    const bub = el("div", "bub");
    bub.append(el("div", "who", t.role === "patient" ? "Patient" : "VITA"));
    bub.append(document.createTextNode(t.text));
    row.append(bub);
    box.append(row);
  }
  d.append(box);
}

async function renderNote(d) {
  const note = await loadNote();
  d.replaceChildren(el("pre", "note-text", note.text || "Intake not yet complete."));
}

async function renderMail(d) {
  const note = await loadNote();
  d.replaceChildren();
  const msgs = note.notifications || [];
  if (!msgs.length) {
    d.append(el("div", "empty", "No email sent for this case."));
    const hint = el("div", "small muted");
    hint.style.cssText = "padding:0 18px 22px;text-align:center";
    hint.textContent = "Email goes out when a notify request is approved in the Requests panel.";
    d.append(hint);
    return;
  }
  for (const m of msgs) {
    const box = el("div", "mail");
    const head = el("div", "mail-head");
    head.append(el("div", null, `To: ${m.recipient_name} <${m.recipient}>`),
                el("div", "tiny muted", m.subject),
                el("div", "tiny", m.status));
    const body = el("div", "mail-body");
    body.append(el("pre", "note-text", m.body));
    box.append(head, body);
    d.append(box);
  }
}

async function showRule(ruleId) {
  try {
    const r = await api(`/api/rules/${ruleId}`);
    const c = r.conditions.map((x) => `  • ${x.fact} ${x.op} ${x.value}`).join("\n");
    alert(`${r.rule_id} — ${r.urgency}, ${r.department}\n\n${r.rationale}\n\nConditions:\n${c}\n\nSource: ${r.source}`);
  } catch { alert(`Rule ${ruleId} could not be loaded.`); }
}

for (const b of document.querySelectorAll(".filters button[data-status]")) {
  b.onclick = () => {
    document.querySelectorAll(".filters button[data-status]").forEach((x) => x.classList.remove("on"));
    b.classList.add("on"); filter = b.dataset.status; refreshQueue();
  };
}
for (const b of document.querySelectorAll("#case-tabs button")) {
  b.onclick = () => {
    document.querySelectorAll("#case-tabs button").forEach((x) => x.classList.remove("on"));
    b.classList.add("on"); tab = b.dataset.tab; renderDetail();
  };
}
for (const b of document.querySelectorAll("#hosp-tabs button")) {
  b.onclick = () => {
    document.querySelectorAll("#hosp-tabs button").forEach((x) => x.classList.remove("on"));
    b.classList.add("on"); hospTab = b.dataset.h; renderHospital();
  };
}
$("refresh").onclick = () => { refreshQueue(); refreshStatus(); renderHospital(); };

refreshStatus();
refreshQueue();
renderHospital();
setInterval(() => { refreshQueue(); if (hospTab === "requests") renderHospital(); }, 8000);
setInterval(refreshStatus, 15000);
</script>
</body>
</html>
